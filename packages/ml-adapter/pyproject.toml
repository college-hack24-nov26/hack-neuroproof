[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerebrachain-ml-adapter"
version = "0.1.0"
description = "Verified MONAI 3D U-Net adapter for ZKP-CerebraChain V2"
requires-python = ">=3.11"
dependencies = [
    "monai>=1.3",
    "nibabel>=5.2",
    "numpy>=1.26",
    "torch>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cerebrachain_ml"]
